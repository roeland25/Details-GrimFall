name: Build WoW Addon ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download addon files
        uses: actions/checkout@v4

      - name: Make ZIP
        run: |
          mkdir -p build/Details

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='README.md' \
            ./ build/Details/

          cd build
          zip -r ../Details-GrimFall.zip Details

      - name: Add ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            Details-GrimFall.zip \
            --clobber
