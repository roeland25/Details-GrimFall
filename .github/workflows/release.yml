name: Build WoW Addon Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build addon ZIP
        run: |
          mkdir -p build/Details

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='README.md' \
            ./ build/Details/

          cd build
          zip -r ../Details-GrimFall.zip Details

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            Details-GrimFall.zip \
            --title "Details GrimFall ${{ github.ref_name }}" \
            --generate-notes
