name: Build WoW Addon ZIP

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, bijvoorbeeld v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download addon files
        uses: actions/checkout@v4

      - name: Make ZIP
        run: |
          mkdir -p build/Details

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='README.md' \
            ./ build/Details/

          cd build
          zip -r ../Details-GrimFall.zip Details

      - name: Add ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi

          echo "Uploading to release: $TAG"

          gh release upload "$TAG" \
            Details-GrimFall.zip \
            --clobber
